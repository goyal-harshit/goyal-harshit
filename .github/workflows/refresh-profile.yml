name: Refresh profile graphics

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - .github/workflows/refresh-profile.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw profile graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py
      - name: Commit only changed graphics
        run: |
          files="hero.svg stats.svg streak.svg langs.svg year.svg"
          test -z "$(git status --porcelain -- $files)" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $files
          git commit -m "stats: refresh profile graphics"
          git push
